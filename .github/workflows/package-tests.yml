# Runs every package's tests, with the bundled catalogs fetched so the catalog tests run too.
# App builds and TestFlight uploads are Xcode Cloud's job.
name: Package tests

on:
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - "Scripts/catalogs.manifest"
      - "Scripts/fetch-catalogs.sh"
      - ".github/workflows/package-tests.yml"
  pull_request:
    paths:
      - "Packages/**"
      - "Scripts/catalogs.manifest"
      - "Scripts/fetch-catalogs.sh"
      - ".github/workflows/package-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # The packages use Xcode 27 SDK APIs (Foundation Models), which macos-26 doesn't have.
    # This image's default Xcode is the release, not one of its betas.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode
        run: xcodebuild -version

      - name: Restore catalogs
        uses: actions/cache@v6
        with:
          path: |
            Apps/MacroTrack/Catalogs/*.db
            Apps/MindTrack/Catalogs/*.db
          key: catalogs-${{ hashFiles('Scripts/catalogs.manifest') }}

      - name: Fetch catalogs
        run: Scripts/fetch-catalogs.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test packages
        env:
          # No Neural Engine on these virtual Macs, so tests that run real Vision OCR are skipped.
          NO_VISION_OCR: "1"
        run: |
          failed=()
          for pkg in Packages/*/; do
            name=$(basename "$pkg")
            echo "::group::$name"
            (cd "$pkg" && swift test) || failed+=("$name")
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "::error::Tests failed in ${failed[*]}"
            exit 1
          fi
