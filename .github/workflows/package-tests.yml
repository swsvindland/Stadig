# Runs every package's tests, with the bundled catalogs fetched so the catalog tests run too.
# App builds and TestFlight uploads are Xcode Cloud's job.
name: Package tests

on:
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - "Scripts/catalogs.manifest"
      - "Scripts/fetch-catalogs.sh"
      - ".github/workflows/package-tests.yml"
  pull_request:
    paths:
      - "Packages/**"
      - "Scripts/catalogs.manifest"
      - "Scripts/fetch-catalogs.sh"
      - ".github/workflows/package-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Restore catalogs
        uses: actions/cache@v4
        with:
          path: |
            Apps/MacroTrack/Catalogs/*.db
            Apps/MindTrack/Catalogs/*.db
          key: catalogs-${{ hashFiles('Scripts/catalogs.manifest') }}

      - name: Fetch catalogs
        run: Scripts/fetch-catalogs.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test packages
        run: |
          failed=()
          for pkg in Packages/*/; do
            name=$(basename "$pkg")
            echo "::group::$name"
            (cd "$pkg" && swift test) || failed+=("$name")
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "::error::Tests failed in ${failed[*]}"
            exit 1
          fi
